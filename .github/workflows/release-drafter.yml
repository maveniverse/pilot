name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Run release drafter
        id: drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        if: github.event_name == 'push'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Sync draft release version with build
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -DforceStdout -B -q -N)
          RELEASE_VERSION=${VERSION%-SNAPSHOT}
          echo "Build version: $VERSION -> Release version: $RELEASE_VERSION"
          gh api repos/${{ github.repository }}/releases/${{ steps.drafter.outputs.id }} \
            -X PATCH \
            -f name="$RELEASE_VERSION" \
            -f tag_name="$RELEASE_VERSION"
